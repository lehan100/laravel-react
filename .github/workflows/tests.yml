jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    
    # 1. Khởi tạo service MySQL "ảo" trên GitHub
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql # Đảm bảo có extension này
          
      # ... các bước cài đặt composer/npm giữ nguyên ...

      # 2. Cấu hình môi trường Test dùng MySQL vừa tạo
      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan migrate # Tạo bảng trên DB ảo
          php artisan test --parallel
